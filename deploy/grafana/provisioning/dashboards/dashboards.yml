# Grafana 仪表盘自动加载（PB-44）
# 由 docker-compose.prod.yml 挂载到 /etc/grafana/provisioning/dashboards
# 容器启动时扫描 /var/lib/grafana/dashboards 下的 JSON，改为文件即生效（updateIntervalSeconds）。
apiVersion: 1

providers:
  - name: campus-overflow
    orgId: 1
    folder: CampusOverflow
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false