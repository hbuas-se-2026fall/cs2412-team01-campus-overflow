name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# 同一 PR / 分支有新推送时取消旧的运行，节省 Actions 额度
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 质量门禁覆盖全部四个限界上下文的领域层与应用层。
  # 原先这份清单是 Sprint 1 的遗留，只有 shared-kernel / identity / qa 三个上下文；
  # 而 qa-application 只依赖 qa-api、qa-domain、identity-api，identity-application 只依赖
  # identity-api、identity-domain，没有任何依赖链能把 co-reputation / co-discovery 拉进
  # `-am` 的 reactor，所以 Sprint 3 合入的这两个上下文的测试从未在 CI 执行过。
  SPRINT_MODULES: co-shared-kernel, co-identity/co-identity-domain, co-identity/co-identity-application, co-qa/co-qa-domain, co-qa/co-qa-application, co-reputation/co-reputation-domain, co-reputation/co-reputation-application, co-discovery/co-discovery-domain, co-discovery/co-discovery-application

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 关键修复：全局安装所有模块（跳过测试），确保本地仓库有所有的 SNAPSHOT 包
      - name: 安装所有依赖模块 (跳过测试)
        run: mvn -B -f backend/pom.xml install -DskipTests

      # 用 verify 而不是 test：jacoco 的 report 与 check 都绑定在 verify 阶段的
      # prepare-agent -> report -> check 链上，只跑到 test 阶段的话覆盖率门禁一次都不会执行。
      - name: 单元测试 + 覆盖率门禁 (领域层 + 应用层)
        run: mvn -B -f backend/pom.xml verify -DskipITs -pl "$SPRINT_MODULES" -am

      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -Dtest=ArchitectureTest

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 删除了 cache 配置，避免找不到 lock 文件报错

      - name: 安装依赖
        working-directory: ./frontend
        run: npm install # 用 install 替代 ci，避免强制要求 package-lock.json

      - name: 构建
        working-directory: ./frontend
        run: npm run build

  # 端到端测试：用 Testcontainers 起 MySQL 8 + Redis 7，跑 CampusOverflowFlowIT。
  # 放在独立 job 里而不是塞进 backend：
  #   1) backend 用 -pl "$SPRINT_MODULES" 只选 9 个模块，co-bootstrap 不在 reactor 里；
  #   2) 起容器的开销不该让单元测试跟着等，并行跑两个 job 总时长基本不变。
  # ubuntu-latest runner 自带 Docker，Testcontainers 可以直接用，不需要 service container。
  e2e:
    name: 端到端测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # co-bootstrap 依赖其它模块的 SNAPSHOT，先装进本地仓库
      - name: 安装所有依赖模块 (跳过测试)
        run: mvn -B -f backend/pom.xml install -DskipTests

      # 注意这里不带 -DskipITs：failsafe 在 verify 阶段执行 *IT 结尾的类
      - name: 端到端集成测试 (Testcontainers)
        run: mvn -B -f backend/pom.xml verify -pl co-bootstrap -am

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-surefire-reports
          path: |
            backend/co-bootstrap/target/surefire-reports/
            backend/co-bootstrap/target/failsafe-reports/
          if-no-files-found: warn
