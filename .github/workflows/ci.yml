name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# 同一 PR / 分支有新推送时取消旧的运行，节省 Actions 额度
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 渐进式质量门禁：Sprint 1 阶段只测试这些模块
  SPRINT_MODULES: co-shared-kernel, co-identity/co-identity-domain, co-identity/co-identity-application, co-qa/co-qa-domain, co-qa/co-qa-application

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 单元测试 (Sprint范围)
        run: mvn -B -f backend/pom.xml test -pl "$SPRINT_MODULES" -am

      # -am 在同一次 reactor 构建中编译所有依赖模块，无需先全量 install；
      # -Dtest 只匹配 ArchitectureTest，其余模块不会重复跑测试
      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -am -Dtest=ArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 删除了 cache 配置，避免找不到 lock 文件报错

      - name: 安装依赖
        working-directory: ./frontend
        run: npm install --no-audit --no-fund # 用 install 替代 ci，避免强制要求 package-lock.json

      - name: 构建
        working-directory: ./frontend
        run: npm run build
